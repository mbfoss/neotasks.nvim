[expressions]
outdir = "{{ projectdir }}/build"

[tasks.build]
type         = "shell"
command      = "python3 tools/build.py {{ outdir }}"
save_buffers = true

[tasks.test]
type             = "process"
command          = "python3 -u tools/runtests.py"
depends_on       = ["build"]
quickfix_matcher = "pytest"
